events {}

http {
    # Two upstream "machines" — uvicorn instances running on the host.
    # nginx round-robins POSTs across them; either can serve any GET because
    # both share the same Postgres + Redis behind the scenes.
    upstream shortener {
        server host.docker.internal:8001;
        server host.docker.internal:8002;
    }

    server {
        listen 8000;

        location / {
            proxy_pass http://shortener;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
