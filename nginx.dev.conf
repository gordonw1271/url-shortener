events {}

http {
    # Dev mode: uvicorn runs on the Windows host (not in Docker) so we can
    # keep --reload for fast iteration. nginx reaches back through Docker's
    # special host-loopback DNS name.
    upstream shortener {
        server host.docker.internal:8001;
        server host.docker.internal:8002;
    }

    server {
        listen 8000;

        location / {
            proxy_pass http://shortener;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
